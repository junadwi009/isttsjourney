    if(target.mode==='add'){if(!p.rooms.some(r=>r.id===target.roomId))throw new Error('Ruang tujuan sudah dihapus.');const s=C.createScene(a,raw.name.replace(/\.[^.]+$/,''),target.kind==='panorama'?'panorama':'photo');s.roomId=target.roomId;s.fit='cover';s.motion=C.normalizeMotion({kind:target.kind==='panorama'?'none':'zoom-in',seconds:12,amount:10});p.scenes.push(s);if(!p.startSceneId)p.startSceneId=s.id;if(!firstScene.id)firstScene.id=s.id;}
    else if(target.mode==='replace'){const s=p.scenes.find(s=>s.id===target.sceneId);if(!s)throw new Error('Foto aktif sudah dihapus.');const newType=target.kind==='panorama'?'panorama':'photo';if(s.type!==newType&&s.hotspots.length)throw new Error('Foto dengan titik tidak dapat berganti jenis proyeksi. Tambah sebagai sudut foto baru.');s.assetId=a.id;s.type=newType;s.view=C.defaultView();s.motion=C.normalizeMotion(s.motion,s.type);}
    else if(target.mode==='cover')p.welcome.coverAssetId=a.id;else if(target.mode==='logo'){p.theme.logoAssetId=a.id;if(C.isSVGData(a.src))p.theme.logoMode='interface';}else if(target.mode==='detail'){const h=p.scenes.find(s=>s.id===target.sceneId)?.hotspots.find(h=>h.id===target.spotId);if(!h)throw new Error('Titik tujuan sudah dihapus.');h.imageAssetId=a.id;}
   }},{render:false});if(ok){if(firstScene.id){this.sceneId=firstScene.id;this.roomId=target.roomId;}this.render();toast(assets.length+' gambar berhasil diproses dan disimpan ke proyek.');}
  }catch(err){toast(err.message,true);}finally{this.uploading=false;$('#s-busy').hidden=true;$('#studio').inert=false;}}
 renderStructure(){const p=this.p,c=M.counts(p),host=$('#s-workspace');host.className='s-workspace s-page';host.innerHTML=`<div class="s-page-header"><div><p class="s-kicker">CAMPUS ARCHITECTURE</p><h1>Struktur kampus</h1><p>${c.buildings} gedung · ${c.floors} lantai · ${c.rooms} entri area / fasilitas</p></div>${action('add-building','Tambah gedung','plus','s-button primary')}</div><div class="s-notice">Struktur ini bukan denah geografis. “Kelas” adalah entri area yang bisa dipecah menjadi beberapa ruang setelah datanya tersedia.</div><div class="s-building-grid">${p.buildings.map(b=>{const fs=p.floors.filter(f=>f.buildingId===b.id).sort((a,b)=>a.number-b.number);return `<article class="s-building-box"><header><span class="s-building-badge">${e(b.code)}</span><div><h2>${e(b.name)}</h2><p>${fs.length} lantai${b.visible?'':' · disembunyikan'}</p></div><button class="c-icon" data-edit-building="${e(b.id)}" aria-label="Edit ${e(b.name)}">${icon('settings')}</button><button class="c-icon danger" data-delete-building="${e(b.id)}" aria-label="Hapus ${e(b.name)}">${icon('trash')}</button></header>${fs.map(f=>`<section class="s-floor-block"><div class="s-floor-block-head"><strong>${e(f.name)}</strong><button class="c-icon" data-edit-floor="${e(f.id)}" aria-label="Edit ${e(b.name+' '+f.name)}">${icon('settings')}</button><button class="c-icon danger" data-delete-floor="${e(f.id)}" aria-label="Hapus ${e(b.name+' '+f.name)}">${icon('trash')}</button></div><div class="s-room-chips">${p.rooms.filter(r=>r.floorId===f.id).map(r=>`<div class="s-room-chip"><button data-select-room="${e(r.id)}"><span class="s-room-status ${M.roomScenes(p,r.id).length?'ready':''}"></span>${e(r.name)}</button><button data-edit-room="${e(r.id)}" aria-label="Edit ${e(b.name+' '+f.name+' '+r.name)}">${icon('settings')}</button></div>`).join('')}<button class="s-add-chip" data-add-room="${e(f.id)}">${icon('plus')}Area</button></div></section>`).join('')}<button class="s-add-floor" data-add-floor="${e(b.id)   for(const type of ['building','floor','room']){host.querySelectorAll(`[data-edit-${type}]`).forEach(b=>b.onclick=()=>this.entityForm(type,b.getAttribute('data-edit-'+type)));host.querySelectorAll(`[data-delete-${type}]`).forEach(b=>b.onclick=()=>this.deleteEntity(type,b.getAttribute('data-delete-'+type)));}

 entityForm(type,id='',parent=''){const p=this.p,plural={building:'buildings',floor:'floors',room:'rooms'}[type],obj=p[plural].find(x=>x.id===id)||{},word={building:'gedung',floor:'lantai',room:'ruang'}[type];
  if(type==='room'&&!p.floors.length){toast('Tambahkan gedung dan lantai terlebih dahulu.',true);this.switchPage('structure');return;}if(type==='floor'&&!p.buildings.length){toast('Tambahkan gedung dahulu.',true);return;}

  let html=f('Nama '+word,'name',obj.name||'', 'required maxlength="160"');

  if(type==='room')html+=`<label class="s-field"><span>Gedung / lantai</span><select name="floorId" aria-label="Gedung / lantai">${choice(Object.fromEntries(p.floors.map(f=>[f.id,p.buildings.find(b=>b.id===f.buildingId).name+' / '+f.name])),obj.floorId||parent||this.room?.floorId||p.floors[0].id)}</select></label><label class="s-field"><span>Kategori</span><select name="category" aria-label="Kategori ruang">${choice(M.categories,obj.category||'lainnya')}</select></label><label class="s-toggle"><span>Tampilkan di direktori</span><input name="visible" type="checkbox" ${obj.visible!==false?'checked':''}></label>`;
  const d=modal((id?'Edit ':'Tambah ')+word,`<form>${html}<div class="s-modal-actions">${id?'<button type="button" class="s-button danger" data-remove>Hapus</button>':''}<button type="submit" class="s-button primary">Simpan ${word}</button></div><p class="s-form-error" role="alert"></p></form>`,true);
  d.querySelector('[data-remove]')?.addEventListener('click',()=>{d.close();this.deleteEntity(type,id);});d.querySelector('form').onsubmit=ev=>{ev.preventDefault();const data=new FormData(ev.target),newId=id||C.uid(type),item={...obj,id:newId,name:String(data.get('name')).trim()};
   if(type==='building')Object.assign(item,{code:String(data.get('code')).trim(),visible:data.has('visible'),description:obj.description||''});if(type==='floor')Object.assign(item,{buildingId:data.get('buildingId'),number:Number(data.get('number'))});if(type==='room')Object.assign(item,{floorId:data.get('floorId'),category:data.get('category'),visible:data.has('visible'),description:obj.description||'',note:obj.note||'',aliases:obj.aliases||''});
   const ok=this.commit(p=>{const a=p[plural];if(id)a.splice(a.findIndex(x=>x.id===id),1,item);else a.push(item);if(type==='room'&&!p.startRoomId)p.startRoomId=newId;});if(ok){d.close();if(type==='room'){this.roomId=newId;this.expandLocation();if(this.page==='builder')this.selectRoom(newId);}}else d.querySelector('.s-form-error').textContent='Tidak tersimpan. Periksa kode unik, nomor lantai, dan data induk.';
  };d.querySelector('input').focus();}
 async deleteEntity(type,id){const tmp=M.snapshot(this.p),effect=M.remove(tmp,type,id),message=`Menghapus ${effect.buildings} gedung, ${effect.floors} lantai, ${effect.rooms} area, dan ${effect.scenes} foto terkait. Semua panah menuju foto yang dihapus juga dibersihkan. Backup JSON sebelum menghapus data penting.`;if(await confirm('Hapus beserta data terkait?',message,'Hapus'))this.commit(p=>M.remove(p,type,id));}
 renderMedia(){const p=this.p,host=$('#s-workspace');host.className='s-workspace s-page';host.innerHTML=`<div class="s-page-header"><div><p class="s-kicker">ASSET LIBRARY</p><h1>Semua gambar, satu tempat.</h1><p>${Object.keys(p.assets).length} gambar tersimpan dalam proyek · foto selalu ditanam di ekspor.</p></div><div class="s-actions">${action('prune','Bersihkan tak terpakai','trash')}${action('upload-library','Unggah gambar','upload','s-button primary')}</div></div><div class="s-media-target"><label class="s-field"><span>Tujuan tombol “Gunakan sebagai foto”</span><select id="s-media-room" aria-label="Ruang tujuan media">${choice(Object.fromEntries(p.rooms.map(r=>[r.id,M.path(p,r.id).label])),this.roomId)}</select></label><label class="s-field"><span>Jenis foto</span><select id="s-media-kind" aria-label="Jenis foto media"><option value="photo">Foto 2D</option><option value="panorama">Panorama 360° (2:1)</option></select></label></div><div class="s-media-grid">${Object.values(p.assets).map(a=>`<article class="s-media-card"><img src="${e(a.thumb)}" alt="${e(a.name)}"><div><h3>${e(a.name)}</h3><p>${a.width} × ${a.height} · ${this.assetUse(a.id)} penggunaan</p><div class="s-media-actions"><button data-use="${e(a.id)}">Gunakan sebagai foto</button><button data-cover="${e(a.id)}">Cover</button><button data-logo="${e(a.id)}">Logo</button><button data-delete="${e(a.id)}" aria-label="Hapus ${e(a.name)}">${icon('trash')}</button></div></div></article>`).join('')||`<div class="s-library-empty">${icon('image')}<h2>Dokumentasi kampusmu dimulai di sini.</h2><p>Unggah foto asli, logo resmi, dan cover kampus.<br>Gambar gedung rekaan dari mockup tidak dimasukkan.</p>${action('upload-library','Unggah gambar pertama','upload','s-button primary')}</div>`}</div>`;this.bindActions(host);
  host.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const rid=$('#s-media-room').value,kind=$('#s-media-kind').value;if(!rid){toast('Buat ruang dahulu.');return;}const a=this.p.assets[b.dataset.use];if(kind==='panorama'&&Math.abs(a.width/a.height-2)>.04){toast('Panorama harus rasio 2:1.',true);return;}const s=C.createScene(a,a.name.replace(/\.[^.]+$/,''),kind);s.roomId=rid;s.fit='cover';if(this.commit(p=>{p.scenes.push(s);if(!p.startSceneId)p.startSceneId=s.id;},{render:false})){this.selectRoom(rid);this.sceneId=s.id;this.refresh();toast('Gambar ditambahkan ke ruang.');}});

 assetUse(id){return (this.p.welcome.coverAssetId===id?1:0)+(this.p.theme.logoAssetId===id?1:0)+this.p.scenes.reduce((n,s)=>n+(s.assetId===id?1:0)+s.hotspots.filter(h=>h.imageAssetId===id).length,0);}
 renderWelcomeEditor(){const p=this.p,w=p.welcome,host=$('#s-workspace');host.className='s-workspace s-welcome-editor';host.innerHTML=`<section class="s-welcome-fields"><p class="s-kicker">FIRST IMPRESSION</p><h1>Welcome page</h1><p class="s-note">Inilah halaman pertama pengunjung sebelum masuk tur kampus.</p>${toggle('Aktifkan welcome page','welcome','enabled',w.enabled)}${field('Label pembuka','welcome','eyebrow',w.eyebrow)}${field('Judul utama','welcome','title',w.title,'textarea')}${field('Deskripsi pembuka','welcome','description',w.description,'textarea')}${field('Teks tombol mulai','welcome','buttonLabel',w.buttonLabel)}${select('Ruang pertama setelah Start','project','startRoomId',p.startRoomId,Object.fromEntries(p.rooms.map(r=>[r.id,M.path(p,r.id).label])))}<div class="s-divider"></div><p class="s-kicker">COVER KAMPUS</p>${w.coverAssetId?`<img class="s-detail-img" src="${e(p.assets[w.coverAssetId].thumb)}" alt="Cover saat ini">`:''}${action('cover','Unggah cover asli','image','s-button full')}${w.coverAssetId?action('remove-cover','Gunakan latar grafis','trash','s-button full'):''}${select('Atau pilih dari media','welcome','coverAssetId',w.coverAssetId,{'':'Tanpa foto / latar grafis',...Object.fromEntries(Object.values(p.assets).map(a=>[a.id,a.name]))})}${field('Fokus horizontal cover (%)','welcome','positionX',w.positionX,'range','min="0" max="100"')}${field('Fokus vertikal cover (%)','welcome','positionY',w.positionY,'range','min="0" max="100"')}${field('Kegelapan cover','welcome','overlay',w.overlay,'range','min="0" max="0.75" step="0.05"')}${select('Posisi teks','welcome','layout',w.layout,{left:'Rata kiri',center:'Tengah pada kartu'})}${toggle('Tampilkan alamat kampus','welcome','showLocation',w.showLocation)}<div class="s-divider"></div>${select('Transisi masuk tur','welcome','entryTransition',w.entryTransition,{'zoom-in':'Zoom + fade',fade:'Fade',none:'Tanpa animasi'})}${field('Durasi masuk (ms)','welcome','entryDuration',w.entryDuration,'number','mi  renderSettings(){const p=this.p,host=$('#s-workspace');host.className='s-workspace s-page';host.innerHTML=`<div class="s-page-header"><div><p class="s-kicker">BRAND & IDENTITY</p><h1>Identitas kampus</h1><p>Digunakan pada welcome, navigasi pengunjung, dan footer HTML.</p></div></div><div class="s-settings-grid"><section class="s-settings-card"><h2>Informasi institusi</h2>${field('Nama proyek','project','name',p.name)}${field('Nama singkat kampus','campus','name',p.campus.name)}${field('Nama lengkap institusi','campus','fullName',p.campus.fullName)}${field('Alamat kampus','campus','address',p.campus.address)}${field('Tentang kampus','campus','about',p.campus.about,'textarea')}${field('Situs kampus','campus','website',p.campus.website,'url')}${field('Halaman profil kampus','campus','aboutUrl',p.campus.aboutUrl,'url')}${field('Tautan informasi admisi','campus','admissionUrl',p.campus.admissionUrl,'url')}</section><section class="s-settings-card"><h2>Brand & kredit</h2>${studioLogoMarkup(p)}${action('logo',p.theme.logoAssetId?'Ganti logo resmi':'Unggah logo resmi','upload','s-button full')}${p.theme.logoAssetId?action('remove-logo','Hapus logo','trash','s-button full'):''}${p.theme.logoAssetId&&C.isSVGData(p.assets[p.theme.logoAssetId].src)?`${select('Mode warna logo SVG','theme','logoMode',p.theme.logoMode,{interface:'Ikuti warna interface',custom:'Warna khusus',original:'Warna asli SVG'})}${p.theme.logoMode==='custom'?field('Warna logo SVG','theme','logoColor',p.theme.logoColor,'color'):''}<p class="s-note">SVG aman dapat mengikuti warna interface atau diberi warna khusus tanpa mengubah file logo.</p>`:'<p class="s-note">Gunakan SVG jika logo perlu mengikuti warna interface secara dinamis.</p>'}${field('Warna aksen interface','theme','accent',p.theme.accent,'color')}${toggle('Tampilkan label titik pada foto','theme','showLabels',p.theme.showLabels)}${field('Pemilik copyright','campus','copyright',p.campus.copyright)}${field('Created by','campus','creator',p.campus.cr  renderPublish(){const p=this.p,r=M.audit(p),c=r.counts,host=$('#s-workspace'),percent=c.rooms?Math.round(c.ready/c.rooms*100):0;host.className='s-workspace s-page';host.innerHTML=`<div class="s-page-header"><div><p class="s-kicker">CONTENT READINESS</p><h1>Periksa sebelum dibagikan.</h1><p>Bedakan kesiapan sistem dan kelengkapan dokumentasi kampus.</p></div>${action('csv','Checklist foto (CSV)','download')}</div><div class="s-readiness-grid"><article class="s-readiness-hero"><p class="s-kicker">KELENGKAPAN FOTO AREA</p><strong>${percent}<small>%</small></strong><div class="s-progress"><span style="width:${percent}%"></span></div><p>${c.ready} dari ${c.rooms} area memiliki minimal satu foto.<br>Cover dan logo tidak dihitung sebagai foto ruang.</p></article><article class="s-readiness-numbers"><div><strong>${c.buildings}</strong><span>Gedung</span></div><div><strong>${c.floors}</strong><span>Lantai</span></div><div><strong>${c.scenes}</strong><span>Sudut foto</span></div><div><strong>${c.hotspots}</strong><span>Titik / panah</span></div></article></div><div class="s-publish-grid"><section class="s-settings-card"><h2>Validasi proyek</h2>${r.errors.length?r.errors.map(m=>`<div class="s-validation error">${icon('close')}<p>${e(m)}</p></div>`).join(''):`<div class="s-validation success">${icon('check')}<p>Struktur data dan referensi panah publik valid.</p></div>`}${r.warnings.map(m=>`<div class="s-validation warn">${icon('info')}<p>${e(m)}</p></div>`).join('')}${toggle('Sembunyikan area tanpa foto dari pengunjung','project','hideEmptyRooms',p.hideEmptyRooms)}<p class="s-note">Area tersembunyi dan catatan internal tidak disertakan dalam HTML. Panah menuju ruang tersembunyi akan memblokir ekspor sampai diperbaiki.</p></section><section class="s-settings-card s-export-card"><p class="s-kicker">PORTABLE DELIVERY</p><h2>Satu file.<br>Siap dibuka di browser.</h2><p>HTML pengunjung memuat direktori, welcome, gambar, titik, panah, dan motion. Tidak memuat editor.</p><p class="s-note" id="s-export-status" role="status">Build <strong>LS-EXPORT-01</strong> · ${typeof root.CampusPublish==='function'?'Exporter siap':'Exporter tidak termuat — jangan reset draft'}</p>${action('download-html','Ekspor HTML pengunjung','upload','s-button primary full')}${action('backup','Backup proyek JSON','download','s-button full')}${action('import','Buka / impor proyek','folder','s-button full')}<p class="s-note">Ekspor tidak otomatis mempublikasikan ke internet. Upload hanya HTML pengunjung ke hosting untuk membagikan tautan.</p><div class="s-divider"></div>${action('reset-seed','Muat ulang template ISTTS','undo','s-button full danger')}<p class="s-note">Impor v1.0–v1.2 dipisahkan ke gedung “Belum dipetakan”, bukan dianggap foto ISTTS.</p></section></div>`;this.bindFields(host);this.bindActions(host);host.querySelector('[data-action="download-html"]').disabled=!!r.errors.length;}

 async importFile(file){if(file.size>C.LIMITS.projectBytes){toast('Proyek melebihi batas 100 MB.',true);return;}try{const raw=JSON.parse(await file.text()),p=M.migrate(raw);$('#s-busy').hidden=false;$('#studio').inert=true;try{await Media.verify(p);}finally{$('#s-busy').hidden=true;$('#studio').inert=false;}if(await confirm('Ganti draft dengan proyek ini?','Proyek “'+p.name+'” akan menggantikan draft aktif. Proyek AruTour lama masuk ke lokasi Belum dipetakan. Backup proyek sekarang dahulu.','Buka proyek')){const ok=this.commit(next=>{for(const k of Object.keys(next))delete next[k];Object.assign(next,p);},{render:false});if(ok){this.roomId=p.startRoomId||p.rooms[0]?.id||'';this.sceneId=M.roomScenes(p,this.roomId)[0]?.id||'';this.spotId='';this.expandLocation();this.page='builder';this.render();toast('Proyek berhasil diimpor.');}}}catch(err){toast(err instanceof SyntaxError?'File bukan JSON valid. Draft tetap utuh.':err.message,true);}}
